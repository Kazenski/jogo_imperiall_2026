name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissoes minimas: ler o codigo, escrever no Pages, emitir token do OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Nunca deixa dois deploys rodando ao mesmo tempo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # ATENCAO: os passos de debug que estavam aqui ("Show git commit",
      # "Show git status", "head -50 src/core/progresso.js" e um `grep`)
      # quebraram o arquivo YAML e derrubaram o deploy. Ver CHANGELOG_TECNICO.
      #
      # O culpado era:
      #     run: grep -n "caixa: box.caixa\|setDepth(1000)" src/ui/comuns.js
      # Em YAML, um escalar sem aspas NAO pode conter ": " (dois-pontos +
      # espaco). O parser lia `run: grep -n "caixa` como chave e o resto
      # como valor de um mapeamento aninhado, e o workflow inteiro deixava de
      # ser valido. O GitHub rejeitava o arquivo ANTES de criar qualquer job:
      # a run aparecia como "failure" com ZERO jobs em menos de 1 segundo.
      #
      # Se for adicionar debug, use um bloco `run: |` com aspas ou escapes:
      #     run: |
      #       grep -n "foo: bar" src/ui/comuns.js

      - name: Testes
        run: npm test

      - name: Build
        # Vite le VITE_* do ambiente em tempo de build.
        # Sao as mesmas variaveis do .env.local. Se nao existirem no repo,
        # o jogo sobe em "modo local" (sem login) sem quebrar o deploy.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publicar artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4